<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password – Shristi</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  
  <!-- ✅ Important: Connect your external CSS -->
  <link rel="stylesheet" href="{% static 'style.css' %}"/>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card forgot-card p-5 shadow-lg" style="max-width: 420px; width: 100%;">
    
    <div class="text-center mb-4">
      <h1 class="display-5 fw-bold brand-color">SHRISTI</h1>
      <p class="tagline">Your gateway to custom artwork</p>
      <h4 class="mt-4 text-light">Reset Password</h4>
      <p class="text-light">We'll send a reset link to your email</p>
    </div>

    <form>
      <div class="mb-4">
        <label class="form-label label-gold">EMAIL ADDRESS</label>
        <input type="email" id="resetEmail" class="form-control form-control-lg input-dark" 
               placeholder="you@example.com" required>
      </div>

      <button type="button" onclick="sendResetLink()" class="btn btn-orange w-100 py-3 mb-3">
        Send Reset Link
      </button>
    </form>

    <div class="text-center">
      <a href="{% url 'login' %}" class="text-light fw-medium">← Back to Sign In</a>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'main.js' %}"></script>
<script>
function sendResetLink() {
  const email = document.getElementById('resetEmail').value.trim();
  if (!email || !email.includes('@')) {
    alert("❌ Please enter a valid email");
    return;
  }
  alert(`✅ Reset link sent to ${email}`);
  setTimeout(() => window.location.href = "{% url 'login' %}", 1500);
}
</script>
</body>
</html>
